<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AVI CX - Proyecto SENA AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Estilos Integrados (CSS3 con Variables de Tema Claro/Oscuro) -->
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-secondary: #ffffff;
      --text-primary: #212529;
      --text-secondary: #6c757d;
      --accent-color: #39a900; /* Verde Institucional SENA */
      --accent-hover: #2e8800;
      --border-color: #e9ecef;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --panel-width: 320px;
    }

    body.dark-mode {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --text-primary: #f8f9fa;
      --text-secondary: #adb5bd;
      --border-color: #2d2d2d;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Barra Lateral FLotante de Herramientas (Prototipo UI) */
    .sidebar-container {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg-secondary);
      padding: 12px 8px;
      border-radius: 30px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      z-index: 1000;
    }

    .sidebar-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s;
    }

    .sidebar-btn:hover {
      background-color: var(--border-color);
      transform: scale(1.05);
    }

    .sidebar-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    .sidebar-btn svg {
      fill: currentColor;
    }

    /* Paneles Desplegables de Herramientas */
    .tool-panel {
      position: fixed;
      right: 76px;
      top: 50%;
      transform: translateY(-50%);
      width: var(--panel-width);
      background: var(--bg-secondary);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 999;
    }

    .tool-panel.open {
      display: flex;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-color);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-secondary);
    }

    /* Estilos de Controles e Insumos */
    textarea, input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      outline: none;
    }

    .btn-action {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: var(--accent-hover);
    }

    .result-box {
      padding: 10px;
      border-radius: 8px;
      background: var(--bg-primary);
      min-height: 60px;
      font-size: 0.9rem;
      word-break: break-word;
    }

    /* Calculadora Grid Layout */
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .calc-btn {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Lista de Contactos */
    .contacts-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .contact-card {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
    }

    .contact-name { font-weight: 600; font-size: 0.9rem; }
    .contact-email { font-size: 0.8rem; color: var(--text-secondary); }
  </style>
</head>
<body>

  <!-- BARRA LATERAL FLOTANTE (BARRA DE HERRAMIENTAS AVI CX) -->
  <div class="sidebar-container">
    <button class="sidebar-btn" id="themeToggleBtn" title="Cambiar Tema" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24" style="width: 20px; height: 20px;"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>

    <button class="sidebar-btn" title="Calculadora" onclick="togglePanel('calcPanel')">
      <svg viewBox="0 0 24 24" style="width: 20px; height: 20px;"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-6 16h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zM7 19H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm12-4H5V5h14v2z"/></svg>
    </button>

    <button class="sidebar-btn" title="Traductor" onclick="togglePanel('transPanel')">
      <svg viewBox="0 0 24 24" style="width: 20px; height: 20px;"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
    </button>

    <button class="sidebar-btn" title="Ortografía" onclick="togglePanel('spellPanel')">
      <svg viewBox="0 0 24 24" style="width: 20px; height: 20px;"><path d="M21.59 11.59l-1.41-1.41L16 14.34l-2.18-2.18-1.41 1.41L16 17.17l5.59-5.58zM11.66 4h-2.31l-5.5 14h2.2l1.34-3.66h5.21l1.34 3.66h2.2l-5.48-14zm-3.5 8.44l2.35-6.42 2.35 6.42h-4.7z"/></svg>
    </button>

    <button class="sidebar-btn" title="Directorio Contactos" onclick="togglePanel('contactsPanel'); loadContacts();">
      <svg viewBox="0 0 24 24" style="width: 20px; height: 20px;"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
    </button>
  </div>

  <!-- PANEL 1: CALCULADORA RÁPIDA -->
  <div class="tool-panel" id="calcPanel">
    <div class="panel-header">
      <span class="panel-title">Calculadora</span>
      <button class="close-btn" onclick="closeAllPanels()">&times;</button>
    </div>
    <input type="text" id="calcDisplay" readonly value="0" style="text-align: right; font-size: 1.2rem;">
    <div class="calc-grid">
      <button class="calc-btn" onclick="clearCalc()">C</button>
      <button class="calc-btn" onclick="pressCalc('/')">/</button>
      <button class="calc-btn" onclick="pressCalc('*')">*</button>
      <button class="calc-btn" onclick="pressCalc('-')">-</button>
      <button class="calc-btn" onclick="pressCalc('7')">7</button>
      <button class="calc-btn" onclick="pressCalc('8')">8</button>
      <button class="calc-btn" onclick="pressCalc('9')">9</button>
      <button class="calc-btn" onclick="pressCalc('+')">+</button>
      <button class="calc-btn" onclick="pressCalc('4')">4</button>
      <button class="calc-btn" onclick="pressCalc('5')">5</button>
      <button class="calc-btn" onclick="pressCalc('6')">6</button>
      <button class="calc-btn" onclick="evalCalc()" style="grid-row: span 2; background: var(--accent-color); color: white;">=</button>
      <button class="calc-btn" onclick="pressCalc('1')">1</button>
      <button class="calc-btn" onclick="pressCalc('2')">2</button>
      <button class="calc-btn" onclick="pressCalc('3')">3</button>
      <button class="calc-btn" onclick="pressCalc('0')" style="grid-column: span 2;">0</button>
      <button class="calc-btn" onclick="pressCalc('.')">.</button>
    </div>
  </div>

  <!-- PANEL 2: TRADUCTOR BILINGÜE -->
  <div class="tool-panel" id="transPanel">
    <div class="panel-header">
      <span class="panel-title">Traductor</span>
      <button class="close-btn" onclick="closeAllPanels()">&times;</button>
    </div>
    <textarea id="transInput" rows="3" placeholder="Ingresa texto aquí..."></textarea>
    <button class="btn-action" onclick="runTranslation()">Traducir</button>
    <div class="result-box" id="transResult">El resultado aparecerá aquí.</div>
  </div>

  <!-- PANEL 3: CORRECCIÓN ORTOGRÁFICA -->
  <div class="tool-panel" id="spellPanel">
    <div class="panel-header">
      <span class="panel-title">Ortografía (ES)</span>
      <button class="close-btn" onclick="closeAllPanels()">&times;</button>
    </div>
    <textarea id="spellInput" rows="3" placeholder="Escribe un párrafo a revisar..."></textarea>
    <button class="btn-action" onclick="runSpellCheck()">Verificar</button>
    <div class="result-box" id="spellResult">El texto corregido aparecerá aquí.</div>
  </div>

  <!-- PANEL 4: DIRECTORIO DE CONTACTOS -->
  <div class="tool-panel" id="contactsPanel">
    <div class="panel-header">
      <span class="panel-title">Contactos SENA</span>
      <button class="close-btn" onclick="closeAllPanels()">&times;</button>
    </div>
    <input type="text" id="contactSearch" placeholder="Buscar por nombre o correo..." onkeyup="filterContacts()">
    <div class="contacts-list" id="contactsContainer">
      <div style="font-size: 0.85rem; color: var(--text-secondary);">Cargando directorio...</div>
    </div>
  </div>

  <!-- SCRIPTS CLIENTE: LÓGICA INTERACTIVA Y COMUNICACIÓN CON APPS SCRIPT -->
  <script>
    var rawContactsData = [];

    // Alternar Tema Claro / Oscuro
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    // Control de Paneles Flotantes
    function togglePanel(panelId) {
      var target = document.getElementById(panelId);
      var isOpen = target.classList.contains('open');
      closeAllPanels();
      if (!isOpen) {
        target.classList.add('open');
      }
    }

    function closeAllPanels() {
      var panels = document.querySelectorAll('.tool-panel');
      panels.forEach(p => p.classList.remove('open'));
    }

    // Lógica Calculadora
    function pressCalc(val) {
      var disp = document.getElementById('calcDisplay');
      if (disp.value === '0') disp.value = '';
      disp.value += val;
    }

    function clearCalc() {
      document.getElementById('calcDisplay').value = '0';
    }

    function evalCalc() {
      var disp = document.getElementById('calcDisplay');
      try {
        disp.value = Function('"use strict"; return (' + disp.value + ')')();
      } catch (e) {
        disp.value = 'Error';
      }
    }

    // Integración con Servidor: Traductor (CU04)
    function runTranslation() {
      var text = document.getElementById('transInput').value;
      var resBox = document.getElementById('transResult');
      resBox.innerText = 'Traduciendo...';

      google.script.run
        .withSuccessHandler(function(res) {
          resBox.innerText = res.text + '\n\n[' + res.label + ']';
        })
        .withFailureHandler(function(err) {
          resBox.innerText = 'Error: ' + err.message;
        })
        .translateText(text);
    }

    // Integración con Servidor: Corrector Ortográfico (CU05)
    function runSpellCheck() {
      var text = document.getElementById('spellInput').value;
      var resBox = document.getElementById('spellResult');
      resBox.innerText = 'Verificando...';

      google.script.run
        .withSuccessHandler(function(res) {
          resBox.innerText = res.text + '\n\n[' + res.label + ']';
        })
        .withFailureHandler(function(err) {
          resBox.innerText = 'Error: ' + err.message;
        })
        .correctSpelling(text);
    }

    // Integración con Servidor: Directorio de Contactos (CU03)
    function loadContacts() {
      var container = document.getElementById('contactsContainer');
      google.script.run
        .withSuccessHandler(function(data) {
          rawContactsData = data;
          renderContacts(data);
        })
        .withFailureHandler(function(err) {
          container.innerHTML = '<div style="color:red; font-size:0.8rem;">Error: ' + err.message + '</div>';
        })
        .getContacts();
    }

    function renderContacts(list) {
      var container = document.getElementById('contactsContainer');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="font-size:0.85rem;">No se encontraron contactos.</div>';
        return;
      }
      container.innerHTML = list.map(c => `
        <div class="contact-card">
          <div class="contact-name">${c.nombre}</div>
          <div class="contact-email">${c.correo}</div>
        </div>
      `).join('');
    }

    function filterContacts() {
      var q = document.getElementById('contactSearch').value.toLowerCase();
      var filtered = rawContactsData.filter(c => 
        c.nombre.toLowerCase().includes(q) || c.correo.toLowerCase().includes(q)
      );
      renderContacts(filtered);
    }
  </script>
</body>
</html>
